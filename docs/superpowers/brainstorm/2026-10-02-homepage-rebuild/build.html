<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swift Horizon · assembled homepage</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="sections/_lib.css">
<style>
body { background: var(--ink-900); }
.bar { position: sticky; top: 0; z-index: 60; background: oklch(0.15 0.01 285 / .96); backdrop-filter: blur(12px); border-bottom: 1px solid var(--hair-dark); }
.bar-in { display: flex; align-items: center; gap: 1.25rem; padding-block: .85rem; }
.bar-in a { font-size: .75rem; letter-spacing: .06em; text-decoration: none; color: var(--gold-100); }
.bar-in .st { margin-left: auto; font-size: .75rem; color: oklch(.93 .014 85 / .5); font-variant-numeric: tabular-nums; }

/* placeholder for un-picked units */
.missing { margin: 2rem auto; max-width: 1360px; padding: 1.5rem; border: 1px dashed var(--gold-line-soft); }
.missing p { margin: 0 0 .75rem; font-size: .875rem; color: oklch(.93 .014 85 / .65); }
.missing a { font-size: .8125rem; color: var(--gold-100); }
.artifact { max-width: 1360px; margin: 3rem auto 5rem; padding: 1.25rem 1.5rem; border: 1px dashed var(--gold-line-soft); font-size: .8125rem; line-height: 1.7; color: oklch(.93 .014 85 / .6); }
.artifact strong { color: var(--gold-100); display: block; margin-bottom: .5rem; letter-spacing: .04em; }

/* nav + footer for the assembled page */
.pg-nav { position: sticky; top: 43px; z-index: 50; background: oklch(0.19 .011 285 / .92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--hair-dark); }
.pg-nav-in { max-width: 1360px; margin-inline: auto; padding-inline: var(--gutter); display: flex; align-items: center; gap: 2.5rem; height: 72px; }
.mark { font-family: var(--sans); font-weight: 700; text-decoration: none; line-height: 1.05; color: var(--on-dark); }
.mark span { display: block; font-size: .9375rem; }
.mark .m2 { color: var(--gold-200); }
.pg-links { display: flex; gap: 1.75rem; margin-left: auto; }
.pg-links a { font-size: .8125rem; letter-spacing: .04em; text-decoration: none; color: oklch(.93 .014 85 / .72); }
.pg-links a:hover { color: var(--gold-100); }
.pg-foot { border-top: 1px solid var(--hair-dark); padding-block: 4rem 3rem; }
.pg-foot-in { max-width: 1360px; margin-inline: auto; padding-inline: var(--gutter); display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 2.5rem; }
.pg-foot h4 { font-size: .6875rem; letter-spacing: .14em; text-transform: uppercase; color: oklch(.93 .014 85 / .42); margin: 0 0 1rem; font-weight: 600; }
.pg-foot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
.pg-foot a, .pg-foot li { font-size: .875rem; color: oklch(.93 .014 85 / .68); text-decoration: none; }
.pg-foot-base { max-width: 1360px; margin: 3rem auto 0; padding: 1.5rem var(--gutter) 0; border-top: 1px solid var(--hair-dark); display: flex; justify-content: space-between; gap: 1rem; font-size: .75rem; color: oklch(.93 .014 85 / .4); }
@media (max-width: 820px) { .pg-foot-in { grid-template-columns: 1fr 1fr } .pg-links { display: none } }
</style>
</head>
<body>

<div class="bar">
  <div class="wrap bar-in" style="display:flex">
    <a href="index.html">&larr; Back to the chooser</a>
    <a href="1a-the-ledger.html">Full candidates</a>
    <span class="st" id="st">assembling…</span>
  </div>
</div>

<div id="out"></div>

<script>
const KEY = 'sh-homepage-picks';
const ORDER = ['h','r','s01','s02','s06','s03','s04','s05','s07','s08','s09','s10','s11','s12'];
const NAMES = {
  h:'Hero', r:'The image rail', s01:'The problem', s02:'The mechanism',
  s06:'Village operations', s03:'The P7 capsule', s04:'The village', s05:'Why modular',
  s07:'What you acquire', s08:'The assumptions', s09:'The network',
  s10:'Between two places', s11:'Three ways in', s12:'The ask'
};

let picks = {};
try { picks = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}

async function committedPicks() {
  try {
    const r = await fetch('picks.json');
    const j = await r.json();
    const out = {};
    Object.keys(j).forEach(k => { if (k[0] !== '_') out[k] = j[k]; });
    return out;
  } catch (e) { return {}; }
}

function nav() {
  return `<header class="pg-nav"><div class="pg-nav-in">
    <a class="mark" href="#"><span>SWIFT</span><span class="m2">HORIZON</span></a>
    <nav class="pg-links">
      <a href="#">The Village</a><a href="#">How It Works</a><a href="#">Ownership</a>
      <a href="#">Locations</a><a href="#">Partnership</a>
    </nav>
    <a class="btn btn-gold" href="#" style="padding:.7rem 1.25rem">Request a briefing</a>
  </div></header>`;
}

function foot() {
  return `<footer class="pg-foot"><div class="pg-foot-in">
    <div>
      <p class="mark" style="margin-bottom:1rem"><span>SWIFT</span><span class="m2">HORIZON</span></p>
      <p style="font-size:.875rem;color:oklch(.93 .014 85 / .55);max-width:32ch">Fully finished modular residences inside professionally managed hospitality villages.</p>
    </div>
    <div><h4>Explore</h4><ul><li><a href="#">The Village</a></li><li><a href="#">How It Works</a></li><li><a href="#">Ownership</a></li><li><a href="#">Locations</a></li></ul></div>
    <div><h4>Participate</h4><ul><li><a href="#">Stay</a></li><li><a href="#">Own</a></li><li><a href="#">Partner</a></li><li><a href="#">Resources</a></li></ul></div>
    <div><h4>Contact</h4><ul><li><a href="#">Request a private briefing</a></li><li><a href="#">About</a></li><li><a href="#">Protections</a></li></ul></div>
  </div>
  <div class="pg-foot-base"><span>© 2026 Swift Horizon · Ghana</span><span>All photography is illustrative reference</span></div></footer>`;
}

async function extract(id, variant) {
  const res = await fetch(`sections/${id}.html`);
  if (!res.ok) return null;
  const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
  const pv = doc.querySelector(`.pv[data-variant="${variant}"] .pv-body`);
  if (!pv) return null;
  return pv.innerHTML.replaceAll('../assets/', 'assets/');
}

(async function () {
  // fall back to the committed picks so the assembly is reproducible for anyone
  if (!Object.keys(picks).length) picks = await committedPicks();

  const out = document.getElementById('out');
  const chosen = ORDER.filter(id => picks[id]);
  const missing = ORDER.filter(id => !picks[id]);

  document.getElementById('st').textContent =
    `${chosen.length} of ${ORDER.length} sections` +
    (missing.length ? ` · ${missing.length} still open` : ' · complete');

  let html = nav();

  for (const id of ORDER) {
    if (!picks[id]) continue;
    const body = await extract(id, picks[id]);
    html += `<section data-unit="${id}" data-variant="${picks[id].toUpperCase()}" style="max-width:1360px;margin-inline:auto;padding-inline:var(--gutter)">
      ${body || `<div class="missing"><p>Could not load ${NAMES[id]}.</p></div>`}
    </section>`;
  }

  if (missing.length) {
    html += `<div class="missing"><p><strong>Still unchosen:</strong> ${missing.map(i => NAMES[i]).join(', ')}.</p>
      <a href="index.html">Finish the chooser →</a></div>`;
  }

  html += foot();
  out.innerHTML = html;

  const note = document.createElement('div');
  note.className = 'artifact';
  note.innerHTML = `<strong>Preview artifact — not part of the design.</strong>
    Each section is wrapped in a 1360px max-width container so you can judge one section at a time,
    which leaves dark gutters beside the cream grounds. In production every ground is full-bleed
    edge to edge. Section padding is also inflated for the same reason — the assembled page
    measures ~9,300px and must come in under the current 7,558px before shipping.`;
  out.appendChild(note);

  document.documentElement.setAttribute('data-assembled', chosen.length);
})();
</script>
</body>
</html>
